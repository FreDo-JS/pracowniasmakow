# =============================================================
#  Konfiguracja nginx dla statycznej strony zbudowanej przez Astro.
#  Trafia do /etc/nginx/conf.d/default.conf
# =============================================================

# Nagłówki cache ustawiane jednym miejscu, zależnie od adresu.
# Dzięki `map` nie trzeba add_header w blokach location —
# a to ważne, bo add_header w location kasuje nagłówki z poziomu wyżej.
map $uri $polityka_cache {
    default                                     "no-cache";
    ~^/_astro/                                  "public, max-age=31536000, immutable";
    ~*\.(png|jpe?g|webp|avif|svg|ico|woff2?)$   "public, max-age=2592000";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # --- kompresja ---
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml;

    # --- nagłówki ---
    # Pliki z hashem w nazwie (/_astro/) mogą leżeć w cache rok, bo przy
    # każdej zmianie treści zmienia się ich nazwa. HTML — nigdy.
    add_header Cache-Control $polityka_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- trasy ---
    # Astro generuje /kontakt/index.html, więc nginx sam obsłuży
    # zarówno /kontakt jak i /kontakt/.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Nie logujemy pytań o favicon i robots — zaśmiecają logi.
    location = /favicon.png { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Ukryte pliki (.env, .git) nie mają prawa wyjść na zewnątrz.
    location ~ /\. {
        deny all;
    }
}
